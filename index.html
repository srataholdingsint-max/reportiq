    <script>
      (function() {
        // Prevent "TypeError: Cannot set property fetch of #<Window> which has only a getter"
        // caused by Chrome extension content scripts attempting assignment on window.fetch
        try {
          var _origFetch = window.fetch;
          var _fetch = _origFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _fetch;
            },
            set: function(fn) {
              _fetch = fn;
            }
          });
        } catch (e) {
          // ignore
        }

        // Suppress extension-injected errors from breaking the web application
        window.addEventListener('error', function(event) {
          if (
            (event.filename && event.filename.indexOf('chrome-extension:') !== -1) ||
            (event.message && event.message.indexOf('fetch of #<Window>') !== -1)
          ) {
            event.stopImmediatePropagation && event.stopImmediatePropagation();
            event.preventDefault && event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
